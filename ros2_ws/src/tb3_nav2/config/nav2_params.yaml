# Nav2 parameters for TurtleBot3 Waffle Pi in the 5x5 m training arena.
#
# Tuned for the same physical constraints as our TD3 training:
#   - max linear velocity  : 0.22 m/s
#   - max angular velocity : 2.0  rad/s
#   - collision threshold  : 0.13 m
# Localization: a custom node republishes Ignition's ground-truth as map→odom
# TF (no AMCL needed in sim).

amcl:
  ros__parameters:
    use_sim_time: True
    # Not actually used — we publish map→odom directly from Ignition ground-truth.
    # Kept here so any default Nav2 launch that loads it doesn't choke.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Note: we deliberately omit `plugin_lib_names` so bt_navigator loads the
    # full Nav2 default plugin set (includes RemovePassedGoals, etc).

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0       # matches local costmap rate, less CPU
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0           # very patient — give Nav2 time to replan around a moving obstacle
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10    # need only 10cm movement (was 0.5m)
      movement_time_allowance: 15.0     # over 15s — robot slows near goal, give it room

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.40            # generous — robot rarely stalls inside this radius
      yaw_goal_tolerance: 6.28           # ignore final orientation
      stateful: True

    # Regulated Pure Pursuit — smooth, predictable, good for differential drive
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.22
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_collision_detection: false     # don't refuse to move when lookahead lands in inflation
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: True
      min_approach_linear_velocity: 0.10  # don't crawl on final approach
      use_regulated_linear_velocity_scaling: True
      use_cost_regulated_linear_velocity_scaling: False  # don't slow down just from inflation cost
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.12         # floor higher so robot keeps moving
      use_rotate_to_heading: False        # don't spin in place near goal — causes erratic behavior
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0
      allow_reversing: False              # forward-only motion (matches our env)

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 10.0          # bumped 5→10 Hz to catch moving cylinders sooner
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.15           # waffle_pi footprint
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30       # larger buffer around dynamic obstacles
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.15
      resolution: 0.05
      track_unknown_space: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.20
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 2.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""              # set at launch time per stage

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True
