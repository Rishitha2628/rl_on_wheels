# TD3 hyperparameters for the custom PyTorch implementation
# (rl/train_td3_torch.py + rl/agents/td3_torch/).

td3:
  learning_rate: 3.0e-4
  buffer_size:   1_000_000
  batch_size:    256
  tau:           0.005
  gamma:         0.99
  train_freq:    1
  gradient_steps: 1
  learning_starts: 10_000
  total_timesteps: 1_000_000

  # TD3-specific
  policy_delay:        2
  target_policy_noise: 0.2
  target_noise_clip:   0.5
  net_arch: [512, 512]

  # OU exploration noise
  action_noise:
    type:  "ou"
    sigma: 0.1
    theta: 0.15

  # Frame stacking + action repeat — the load-bearing change on this branch.
  frame_stack:   4
  action_repeat: 4

env:
  lidar_bins: 36
  max_lidar_range: 3.5
  collision_threshold: 0.13
  tb3_model: "waffle_pi"
  goal_tolerance: 0.20
  max_episode_steps: 450
  clearance_threshold: 0.8

  goal_reward: 1.0
  collision_penalty: -1.0
  time_penalty: -0.005
  distance_reward_scale: 1.0

  min_linear_vel:   0.0
  max_linear_vel:   0.22
  max_angular_vel:  2.0

  world_bounds: [-2.0, 2.0, -2.0, 2.0]
  robot_min_goal_dist: 0.5

  successive_goals: false
  difficulty_radius_init: 1.0
  difficulty_radius_min:  0.5
  difficulty_radius_max:  4.0
  difficulty_grow:        1.01
  difficulty_shrink:      0.99

ros2:
  observation_service: "/get_observation"
  step_service: "/step"
  reset_service: "/reset_episode"
  cmd_vel_topic: "/cmd_vel"
  scan_topic: "/scan"
  odom_topic: "/odom"
  goal_pose_topic: "/goal_pose"
  reward_topic: "/reward"
  episode_done_topic: "/episode_done"
  service_timeout_sec: 10.0
  step_duration_sec: 0.1

training:
  checkpoint_dir:  "/checkpoints"
  checkpoint_freq: 2_000
  tensorboard_log: "/logs/tensorboard"
  log_interval:    10

eval:
  n_eval_episodes: 10
  deterministic: true
