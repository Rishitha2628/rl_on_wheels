sac:
  learning_rate: 3.0e-4
  buffer_size: 1_000_000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  # 8 grad/step caused Q-value divergence (critic overfitting to recent buffer
  # faster than fresh data could arrive). 4 is the safe compromise: still
  # gets more out of slow ROS env than the default 1, without instability.
  gradient_steps: 4
  ent_coef: "auto"
  # SB3 default (-action_dim = -2) — log_prob is computed in pre-rescale
  # [-1,1] squashed space, so the action-bound rescale does not affect it.
  target_entropy: "auto"
  target_update_interval: 2
  learning_starts: 5000
  total_timesteps: 1_000_000

env:
  lidar_bins: 36
  max_lidar_range: 3.5
  collision_threshold: 0.2
  tb3_model: "waffle_pi"
  goal_tolerance: 0.3
  max_episode_steps: 600
  clearance_threshold: 0.8

  # Reward weights (used by env_bridge_node)
  goal_reward: 1.0
  collision_penalty: -1.0
  time_penalty: -0.005
  distance_reward_scale: 1.0

  # TurtleBot3 waffle_pi velocity limits.
  # Angular bumped from 0.5 → 1.0 so the robot can actually turn fast enough
  # to dodge obstacles given the gate's reaction window. Hardware supports 1.82.
  min_linear_vel:  0.0          # m/s (no reverse — kept forward-only)
  max_linear_vel:  0.26         # m/s
  max_angular_vel: 1.0          # rad/s

  # World bounds for random spawns [x_min, x_max, y_min, y_max]
  world_bounds: [-2.0, 2.0, -2.0, 2.0]
  robot_min_goal_dist: 0.5      # minimum distance from spawn to goal

ros2:
  observation_service: "/get_observation"
  step_service: "/step"
  reset_service: "/reset_episode"
  cmd_vel_topic: "/cmd_vel"
  scan_topic: "/scan"
  odom_topic: "/odom"
  goal_pose_topic: "/goal_pose"
  reward_topic: "/reward"
  episode_done_topic: "/episode_done"
  service_timeout_sec: 10.0
  step_duration_sec: 0.1        # seconds to apply action before reading obs

training:
  checkpoint_dir: "/checkpoints"
  checkpoint_freq: 10_000
  tensorboard_log: "/logs/tensorboard"
  log_interval: 10

eval:
  n_eval_episodes: 10
  deterministic: true
