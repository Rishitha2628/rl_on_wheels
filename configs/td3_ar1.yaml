# TD3 with action_repeat = 1, i.e. deciding every bridge step (10 Hz) rather
# than holding each action for four (2.5 Hz).
#
# Why: BC is evaluated at 10 Hz on a 4-frame stacked observation while TD3 runs
# at 2.5 Hz on a single frame, so the BC-vs-TD3 gap confounds the algorithm
# with control rate and observation history. This isolates the control rate.
#
# Note on cost: at action_repeat 1 the same number of BRIDGE steps means four
# times as many agent steps and four times as many gradient updates, so these
# runs are slower per environment step than the action_repeat 4 ones.
# Otherwise identical to td3_tune_a.yaml (lr 3e-4, OU sigma 0.1).

# TUNING DIAGNOSTIC a: learning_rate=3.0e-4, OU sigma=0.1.
#
# The values in td3.yaml (lr 1e-4, sigma 0.05) were chosen to FINE-TUNE an
# already-converged policy -- its own comments say so, and note that policy
# had plateaued at ~0.59. Training from scratch with them may simply
# reproduce that plateau, which is close to what the sweep measured (0.62-0.645).
# This variant restores from-scratch-appropriate values to test whether ~64%
# is the task's ceiling or the configuration's.

# TD3 hyperparameters for TurtleBot3 navigation.

td3:
  # 3e-4 is SB3's tested default. Fine-tune phase dropped from 3e-4 to 1e-4
  # to escape the plateau the policy hit at ~0.59 success rate.
  learning_rate: 3.0e-4
  buffer_size: 1_000_000
  batch_size: 128
  tau: 0.003
  gamma: 0.99
  train_freq: 1              # one grad step per env step
  gradient_steps: 1
  learning_starts: 10000
  total_timesteps: 1_000_000

  # TD3-specific
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  net_arch: [512, 512]

  # Exploration noise — sigma reduced from 0.1 → 0.05 for fine-tune phase.
  # The policy is converged; aggressive exploration was perturbing it.
  action_noise:
    type: "ou"
    sigma: 0.1
    theta: 0.15

  # action_repeat=4 for smoother motion (less physics stress at max
  # angular velocity).
  frame_stack: 1
  action_repeat: 1

env:
  lidar_bins: 36
  max_lidar_range: 3.5
  collision_threshold: 0.13
  tb3_model: "waffle_pi"
  goal_tolerance: 0.20
  # At our 0.4 s/agent-step (action_repeat=4 × step_duration=0.1),
  # 125 ticks ≈ 50 s. 450 gives a buffer for harder goals.
  max_episode_steps: 450
  clearance_threshold: 0.8

  # Reward weights — unused (reward is hardcoded in env_bridge_node).
  goal_reward: 1.0
  collision_penalty: -1.0
  time_penalty: -0.005
  distance_reward_scale: 1.0

  min_linear_vel:   0.0        # no backward motion
  max_linear_vel:   0.22
  max_angular_vel:  2.0

  world_bounds: [-2.0, 2.0, -2.0, 2.0]
  robot_min_goal_dist: 0.5

  # SIMPLE MODE — one goal per episode, no successive chaining.
  # Each episode: robot teleports to fixed spawn (-0.7, 0), random goal
  # spawns somewhere in the arena. Episode ends on goal-reach, collision,
  # or timeout. Clean per-episode success_rate metric.
  successive_goals: false
  # Unused when successive_goals=false; kept for future flip.
  difficulty_radius_init: 1.0
  difficulty_radius_min:  0.5
  difficulty_radius_max:  4.0
  difficulty_grow:        1.01
  difficulty_shrink:      0.99

ros2:
  observation_service: "/get_observation"
  step_service: "/step"
  reset_service: "/reset_episode"
  cmd_vel_topic: "/cmd_vel"
  scan_topic: "/scan"
  odom_topic: "/odom"
  goal_pose_topic: "/goal_pose"
  reward_topic: "/reward"
  episode_done_topic: "/episode_done"
  # 60s, not 10. A /step call that is slow because the machine is
  # momentarily starved is not a fatal error, but at 10s the worker raised
  # and took the whole SubprocVecEnv down with it (seed 0, 2026-08-27).
  # Deliberately NOT a retry: if the call timed out the request may still be
  # in flight, and re-sending would step the robot twice and corrupt the
  # trajectory. Waiting longer for the single in-flight call is safe; retrying
  # is not. 60s is 600x the nominal step, so a genuine hang still fails fast
  # enough to notice.
  service_timeout_sec: 60.0
  step_duration_sec: 0.1

training:
  checkpoint_dir: "/checkpoints"
  checkpoint_freq: 2_000
  tensorboard_log: "/logs/tensorboard"
  log_interval: 10

eval:
  n_eval_episodes: 10
  deterministic: true
