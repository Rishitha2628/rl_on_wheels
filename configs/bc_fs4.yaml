# BC factorial cell: frame_stack=4. Paired with an eval-time action
# repeat of 1 or 4 (bc/eval.py --action-repeat) to separate what the comparison
# against TD3 was actually measuring: TD3 decides at 2.5 Hz on a single 42-dim
# frame, BC at 10 Hz on four stacked 40-dim frames, so 'BC vs TD3' confounds
# algorithm with control rate and observation history.

# Behavior cloning config for STAGE 4 (the budget-sweep arena).
#
# Derived from bc.yaml, which targets stage 5 at 6.0 m lidar. The only change
# is max_lidar_range, but it is not cosmetic: it rescales most of the
# observation vector, so a BC policy trained under one value is not comparable
# with a TD3 policy trained under the other.

# Behavior cloning training config.
# The BC policy imitates Nav2 demonstrations collected via ros2 bag.

bc:
  learning_rate: 1.0e-3
  batch_size:    256
  epochs:        100
  val_fraction:  0.1
  net_arch:      [512, 512]
  # Number of consecutive observations to stack as input. With dynamic
  # obstacles, a single frame can't distinguish "obstacle at 0.6 m, static"
  # from "obstacle at 0.6 m, moving toward me". Stacking 4 lets the policy
  # infer velocity from consecutive lidar deltas.
  frame_stack:   4

# Same env settings as TD3 so the BC policy sees identical observations
# at training (computed offline from the bag) and at eval time (live).
env:
  lidar_bins: 36
  max_lidar_range: 3.5   # stage 4. MUST match configs/td3.yaml — BC and TD3 are
                         # compared directly, and lidar range sets the
                         # normalisation of 36 of the 40 observation dims.
  collision_threshold: 0.13
  tb3_model: "waffle_pi"
  goal_tolerance: 0.40   # match Nav2's xy_goal_tolerance the demos were collected with
  max_episode_steps: 450
  clearance_threshold: 0.8

  goal_reward: 1.0
  collision_penalty: -1.0
  time_penalty: -0.005
  distance_reward_scale: 1.0

  min_linear_vel:   0.0
  max_linear_vel:   0.22
  max_angular_vel:  2.0

  world_bounds: [-2.0, 2.0, -2.0, 2.0]
  robot_min_goal_dist: 0.5

  successive_goals: false
  difficulty_radius_init: 1.0
  difficulty_radius_min:  0.5
  difficulty_radius_max:  4.0
  difficulty_grow:        1.01
  difficulty_shrink:      0.99

ros2:
  observation_service: "/get_observation"
  step_service: "/step"
  reset_service: "/reset_episode"
  cmd_vel_topic: "/cmd_vel"
  scan_topic: "/scan"
  odom_topic: "/odom"
  goal_pose_topic: "/goal_pose"
  reward_topic: "/reward"
  episode_done_topic: "/episode_done"
  # 60s, not 10. A /step call that is slow because the machine is
  # momentarily starved is not a fatal error, but at 10s the worker raised
  # and took the whole SubprocVecEnv down with it (seed 0, 2026-08-27).
  # Deliberately NOT a retry: if the call timed out the request may still be
  # in flight, and re-sending would step the robot twice and corrupt the
  # trajectory. Waiting longer for the single in-flight call is safe; retrying
  # is not. 60s is 600x the nominal step, so a genuine hang still fails fast
  # enough to notice.
  service_timeout_sec: 60.0
  step_duration_sec: 0.1

training:
  checkpoint_dir:   "/checkpoints"
  tensorboard_log:  "/logs/tensorboard"
  log_interval:     100
  save_every_epoch: 5
