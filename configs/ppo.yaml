ppo:
  learning_rate: 3.0e-4
  n_steps: 2048           # steps collected per update (rollout buffer size)
  batch_size: 64
  n_epochs: 10            # gradient passes over each rollout
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01          # fixed entropy bonus (no auto-temperature in PPO)
  vf_coef: 0.5
  max_grad_norm: 0.5
  total_timesteps: 1_000_000

env:
  lidar_bins: 36
  max_lidar_range: 3.5
  collision_threshold: 0.2
  tb3_model: "waffle_pi"
  goal_tolerance: 0.3
  max_episode_steps: 600
  max_linear_vel: 0.26
  max_angular_vel: 0.5
  world_bounds: [-2.0, 2.0, -2.0, 2.0]
  robot_min_goal_dist: 0.5

ros2:
  observation_service: "/get_observation"
  step_service: "/step"
  reset_service: "/reset_episode"
  cmd_vel_topic: "/cmd_vel"
  scan_topic: "/scan"
  odom_topic: "/odom"
  goal_pose_topic: "/goal_pose"
  service_timeout_sec: 10.0
  step_duration_sec: 0.1

training:
  checkpoint_dir: "/checkpoints_ppo"
  checkpoint_freq: 10_000
  tensorboard_log: "/logs/tensorboard_ppo"
  log_interval: 1
